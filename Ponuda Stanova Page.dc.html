<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html{scroll-behavior:smooth;}
    body{margin:0;background:#F7F6F3;-webkit-font-smoothing:antialiased;}
    a{color:#9C7A4A;text-decoration:none;}
    a:hover{color:#7E623B;}
    @keyframes shimmerMove{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
    image-slot { pointer-events: none; }
  </style>
</helmet>
<div style="{{ pageStyle }}">

  <dc-import name="Navigation" accent-color="{{ accent }}" current-page="ponuda-stanova" hint-size="100%,80px"></dc-import>

  <div style="{{ crumbWrapStyle }}">
    <a href="index.dc.html" style="{{ crumbLinkStyle }}" style-hover="{{ crumbLinkHoverStyle }}">Naslovna</a>
    <span style="{{ crumbSepStyle }}">/</span>
    <span style="{{ crumbActiveStyle }}">Ponuda stanova</span>
  </div>

  <div id="rv-head" style="{{ sectionWrapStyle }}">
    <div style="{{ sectionHeadStyle }}">
      <div style="{{ sectionEyebrowStyle }}">Portfolio</div>
      <div style="{{ sectionTitleStyle }}">Aktivni projekti</div>
      <div style="{{ sectionDividerStyle }}"></div>
      <p style="{{ sectionSubStyle }}">Pregledajte na&scaron;e aktivne projekte po lokaciji i statusu izgradnje.</p>
    </div>
    <div style="{{ locationTabRowStyle }}">
      <sc-for list="{{ locationTabs }}" as="tab" hint-placeholder-count="3">
        <button onClick="{{ tab.onClick }}" onMouseEnter="{{ tab.onMouseEnter }}" onMouseLeave="{{ tab.onMouseLeave }}" style="{{ tab.tabStyle }}">{{ tab.label }}</button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ hasProjects }}" hint-placeholder-val="{{ true }}">
    <div id="rv-grid" style="{{ gridOuterStyle }}">
      <div style="{{ projectGridStyle }}">
        <sc-for list="{{ projects }}" as="proj" hint-placeholder-count="3">
          <a href="{{ proj.href }}" onMouseEnter="{{ proj.onEnter }}" onMouseLeave="{{ onLeaveProject }}" style="{{ proj.cardStyle }}" style-hover="{{ cardHoverStyle }}">
            <div style="{{ imgFrameStyle }}">
              <image-slot id="{{ proj.slotId }}" src="{{ proj.slotSrc }}" placeholder="{{ proj.placeholder }}" shape="rect" style="{{ cardImgStyle }}" style-hover="{{ cardImgHoverStyle }}"></image-slot>
              <div style="{{ shineOverlayStyle }}" style-hover="{{ shineOverlayHoverStyle }}"></div>
              <div style="{{ proj.statusTagStyle }}">{{ proj.statusLabel }}</div>
            </div>
            <div style="{{ captionRowStyle }}">
              <div>
                <div style="{{ cardNameStyle }}">{{ proj.name }}</div>
                <div style="{{ cardLocStyle }}">{{ proj.locationLabel }}</div>
                <div style="{{ proj.unitsDetailStyle }}">{{ proj.unitsLabel }}</div>
              </div>
              <span style="{{ proj.arrowStyle }}">&#8594;</span>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showEmptyState }}" hint-placeholder-val="{{ false }}">
    <div style="{{ emptyStateStyle }}">Nema projekata koji odgovaraju izabranom filteru.</div>
  </sc-if>

  <div style="{{ bottomSpacerStyle }}"></div>

  <dc-import name="Footer" accent-color="{{ accent }}" hint-size="100%,400px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9C7A4A&quot;,&quot;options&quot;:[&quot;#9C7A4A&quot;,&quot;#B8934F&quot;,&quot;#7A8A78&quot;,&quot;#8C7A6B&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1440, hoverKey: null, hoveredProjectKey: null, activeLocation: 'all', revealed: {} };

  projectsData = [
    { key: 'central-line', name: 'Central Line', locationSlug: 'stari-aerodrom', locationLabel: 'Stari Aerodrom, Podgorica', statusSlug: 'u-izgradnji', statusLabel: 'U izgradnji \u2013 rok 2026', unitsLabel: 'Preostalo 18 jedinica u ponudi', slotId: 'ponuda-cl', placeholder: 'Central Line', slotSrc: './uploads/central_line.webp', href: './Project Page.dc.html' },
    { key: 'premium-kvart-2', name: 'Premium Kvart II', locationSlug: 'city-kvart', locationLabel: 'City Kvart, Podgorica', statusSlug: 'u-izgradnji', statusLabel: 'U izgradnji \u2013 rok 2027', unitsLabel: 'Preostalo 24 jedinice u ponudi', slotId: 'ponuda-pk2', placeholder: 'Premium Kvart II', slotSrc: './uploads/premium_kvart_2.webp', href: './Project Page.dc.html' },
    { key: 'premium-kvart', name: 'Premium Kvart', locationSlug: 'city-kvart', locationLabel: 'City Kvart, Podgorica', statusSlug: 'useljivo', statusLabel: 'Useljivo', unitsLabel: 'Poslednje jedinice u ponudi', slotId: 'ponuda-pk', placeholder: 'Premium Kvart', slotSrc: './uploads/premium_kvart.webp', href: './Project Page.dc.html' }
  ];

  revealIds = ['rv-head', 'rv-grid'];

  componentDidMount() {
    this._onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    this._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          this.setState(s => ({ revealed: { ...s.revealed, [id]: true } }));
          this._observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    this.revealIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) {
        this.setState(s => ({ revealed: { ...s.revealed, [id]: true } }));
      } else {
        this._observer.observe(el);
      }
    });
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    if (this._observer) this._observer.disconnect();
  }

  setHoverKey(key) { this.setState({ hoverKey: key }); }
  clearHoverKey() { this.setState({ hoverKey: null }); }
  setHoveredProject(key) { this.setState({ hoveredProjectKey: key }); }
  setLocation(slug) { this.setState({ activeLocation: slug }); }

  renderVals() {
    const w = this.state.width || 1440;
    const isMobile = w < 640;
    const isTablet = w >= 640 && w < 1024;
    const accent = this.props.accentColor || '#9C7A4A';
    const charcoal = '#1A1A1A';
    const ivory = '#F7F6F3';
    const hairline = 'rgba(26,26,26,0.10)';
    const muted = 'rgba(26,26,26,0.58)';
    const containerPad = isMobile ? 22 : (isTablet ? 48 : 80);
    const sectionTitleSize = isMobile ? 28 : (isTablet ? 40 : 44);
    const projectCols = isMobile ? 1 : (isTablet ? 2 : 3);
    const serif = "'Cormorant Garamond', serif";
    const sans = "'Cormorant Garamond', serif";
    const numFont = "'Cormorant Garamond', serif";
    const easeOut = 'cubic-bezier(0.16,1,0.3,1)';
    const hk = this.state.hoverKey;

    const reveal = (id, opts) => {
      const isRevealed = !!this.state.revealed[id];
      const delay = (opts && opts.delay) || 0;
      const distance = (opts && opts.distance) || 30;
      return { opacity: isRevealed ? 1 : 0, transform: isRevealed ? 'translateY(0)' : 'translateY(' + distance + 'px)', transition: 'opacity 0.9s ' + easeOut + ' ' + delay + 's, transform 0.9s ' + easeOut + ' ' + delay + 's' };
    };

    const activeLocation = this.state.activeLocation;
    const filteredProjects = this.projectsData.filter(p => activeLocation === 'all' || p.locationSlug === activeLocation);
    const hoveredKey = this.state.hoveredProjectKey;
    const projects = filteredProjects.map((p, i) => {
      const isHovered = hoveredKey === p.key;
      return {
        ...p,
        onEnter: () => this.setHoveredProject(p.key),
        cardStyle: { display: 'block', minWidth: 0, maxWidth: '100%', transition: 'transform 0.5s ' + easeOut + ', box-shadow 0.5s ease', ...reveal('rv-grid', { delay: i * 0.12 }) },
        statusTagStyle: { fontFamily: numFont, position: 'absolute', top: '16px', left: '16px', background: isHovered ? accent : 'rgba(251,251,249,0.92)', color: isHovered ? '#FBFBF9' : charcoal, fontSize: '12px', fontWeight: 700, letterSpacing: '1px', textTransform: 'uppercase', padding: '6px 12px', whiteSpace: 'nowrap', transition: 'background 0.35s ease, color 0.35s ease' },
        arrowStyle: { fontSize: '20px', color: accent, display: 'inline-block', transform: isHovered ? 'translateX(4px)' : 'translateX(0)', transition: 'transform 0.35s ' + easeOut },
        unitsDetailStyle: { fontFamily: numFont, fontSize: '13.5px', color: accent, marginTop: '8px', fontWeight: 700, opacity: isHovered ? 1 : 0, transform: isHovered ? 'translateY(0)' : 'translateY(7px)', transition: 'opacity 0.4s ' + easeOut + ', transform 0.4s ' + easeOut }
      };
    });

    const locationTabDefs = [{ value: 'all', label: 'Svi projekti' }, { value: 'stari-aerodrom', label: 'Stari Aerodrom' }, { value: 'city-kvart', label: 'City Kvart' }];
    const locationTabs = locationTabDefs.map(t => {
      const tabKey = 'tab-' + t.value;
      const isHov = hk === tabKey;
      const isActive = activeLocation === t.value;
      return {
        label: t.label,
        onClick: () => this.setLocation(t.value),
        onMouseEnter: () => this.setHoverKey(tabKey),
        onMouseLeave: () => this.clearHoverKey(),
        tabStyle: { background: 'none', border: 'none', borderBottom: (isActive || isHov) ? '2px solid ' + accent : '2px solid transparent', padding: '9px 4px', marginRight: isMobile ? '20px' : '32px', fontFamily: sans, fontSize: '15px', fontWeight: isActive ? 700 : 500, color: isActive ? charcoal : (isHov ? accent : muted), cursor: 'pointer', whiteSpace: 'nowrap', transform: isHov ? 'translateY(-1px)' : 'translateY(0)', transition: 'color 0.3s ease-out, border-color 0.3s ease-out, transform 0.3s ease-out' }
      };
    });

    return {
      accent,
      pageStyle: { background: ivory, color: charcoal, fontFamily: sans, minHeight: '100vh', position: 'relative', paddingTop: (isMobile ? 64 : 80) + 'px' },
      crumbWrapStyle: { maxWidth: '1320px', margin: '0 auto', padding: '20px ' + containerPad + 'px 0', display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', fontSize: '14.5px', color: muted, fontFamily: sans },
      crumbLinkStyle: { color: muted, transition: 'color 0.25s ease' },
      crumbLinkHoverStyle: { color: accent },
      crumbSepStyle: { color: muted },
      crumbActiveStyle: { color: charcoal, fontWeight: 600 },

      sectionWrapStyle: { maxWidth: '1320px', margin: '0 auto', padding: '20px ' + containerPad + 'px 0' },
      sectionHeadStyle: { maxWidth: '640px', margin: '0 0 ' + (isMobile ? 18 : 24) + 'px' },
      sectionEyebrowStyle: { fontFamily: sans, textTransform: 'uppercase', letterSpacing: '3px', fontSize: '13.5px', color: accent, fontWeight: 600, marginBottom: '10px' },
      sectionTitleStyle: { fontFamily: serif, fontWeight: 600, fontSize: sectionTitleSize + 'px', color: charcoal, margin: '0 0 14px', lineHeight: 1.15 },
      sectionDividerStyle: { width: '48px', height: '2px', margin: '0 0 14px', backgroundImage: 'linear-gradient(90deg, ' + accent + ' 0%, #E8D9BE 25%, ' + accent + ' 50%, #E8D9BE 75%, ' + accent + ' 100%)', backgroundSize: '200% 100%', animation: 'shimmerMove 5s linear infinite' },
      sectionSubStyle: { fontFamily: sans, color: muted, fontSize: '16.5px', lineHeight: 1.7, margin: 0, fontWeight: 400 },

      locationTabRowStyle: { display: 'flex', overflowX: 'auto', borderBottom: '1px solid ' + hairline, marginBottom: isMobile ? '18px' : '28px' },
      locationTabs,
      hasProjects: projects.length > 0,
      showEmptyState: projects.length === 0,
      emptyStateStyle: { fontFamily: sans, color: muted, fontSize: '15px', padding: '40px 0', textAlign: 'center', maxWidth: '1320px', margin: '0 auto' },
      projects,
      onLeaveProject: () => this.setHoveredProject(null),
      gridOuterStyle: { maxWidth: '1320px', margin: '0 auto', padding: '0 ' + containerPad + 'px' },
      projectGridStyle: { display: 'grid', gridTemplateColumns: 'repeat(' + projectCols + ', minmax(0, 1fr))', gap: isMobile ? '30px' : '48px' },
      cardHoverStyle: { transform: 'translateY(-10px)', boxShadow: '0 34px 64px rgba(26,26,26,0.16), 0 0 36px rgba(156,122,74,0.16)' },
      imgFrameStyle: { position: 'relative', overflow: 'hidden', width: '100%', aspectRatio: '1/1', background: '#EAE8E3' },
      cardImgStyle: { position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', maxWidth: '100%', objectFit: 'cover', transition: 'transform 0.7s ' + easeOut },
      cardImgHoverStyle: { transform: 'scale(1.06)' },
      shineOverlayStyle: { position: 'absolute', top: 0, left: '-60%', width: '40%', height: '100%', background: 'linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.28) 50%, transparent 100%)', transform: 'skewX(-18deg)', pointerEvents: 'none', transition: 'left 0.85s ' + easeOut, zIndex: 2 },
      shineOverlayHoverStyle: { left: '130%' },
      captionRowStyle: { display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', padding: '20px 2px 0', borderTop: '1px solid ' + hairline, marginTop: '18px' },
      cardNameStyle: { fontFamily: serif, fontWeight: 600, fontSize: '22px', color: charcoal, marginBottom: '4px' },
      cardLocStyle: { fontFamily: sans, fontSize: '13.5px', color: muted, textTransform: 'uppercase', letterSpacing: '1.5px' },
      bottomSpacerStyle: { height: (isMobile ? 70 : 130) + 'px' }
    };
  }
}
</script>
</body>
</html>
