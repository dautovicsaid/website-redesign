<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    html{scroll-behavior:smooth;}
    body{margin:0;background:#F7F6F3;-webkit-font-smoothing:antialiased;}
    a{color:#9C7A4A;text-decoration:none;}
    a:hover{color:#7E623B;}
    @keyframes shimmerMove{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
    image-slot { pointer-events: none; }
  </style>
</helmet>
<div style="{{ pageStyle }}">

  <dc-import name="Navigation" accent-color="{{ accent }}" current-page="{{ navCurrentPage }}" hint-size="100%,80px"></dc-import>

  <div style="{{ crumbWrapStyle }}">
    <a href="index.dc.html" style="{{ crumbLinkStyle }}" style-hover="{{ crumbLinkHoverStyle }}">Naslovna</a>
    <span style="{{ crumbSepStyle }}">/</span>
    <a href="{{ parentCrumbHref }}" style="{{ crumbLinkStyle }}" style-hover="{{ crumbLinkHoverStyle }}">{{ parentCrumbLabel }}</a>
    <span style="{{ crumbSepStyle }}">/</span>
    <a href="Project%20Page.dc.html" style="{{ crumbLinkStyle }}" style-hover="{{ crumbLinkHoverStyle }}">{{ projectName }}</a>
    <span style="{{ crumbSepStyle }}">/</span>
    <span style="{{ crumbActiveStyle }}">{{ categoryLabel }}</span>
  </div>

  <div style="{{ headWrapStyle }}">
    <div style="{{ eyebrowStyle }}">KIPS Gradnja &mdash; Ponuda</div>
    <h1 style="{{ titleStyle }}">{{ categoryLabel }} &mdash; {{ projectName }}</h1>
    <div style="{{ dividerStyle }}"></div>
    <p style="{{ leadStyle }}">Izaberite lamelu za pregled tlocrta i dostupnih jedinica.</p>
  </div>

  <div id="rv-grid" style="{{ gridWrapStyle }}">
    <div style="{{ lamelaGridStyle }}">
      <sc-for list="{{ lamelas }}" as="lam" hint-placeholder-count="3">
        <a href="{{ lam.href }}" onMouseEnter="{{ lam.onEnter }}" onMouseLeave="{{ onLeaveLamela }}" style="{{ lam.cardStyle }}" style-hover="{{ cardHoverStyle }}">
          <div style="{{ imgFrameStyle }}">
            <image-slot id="{{ lam.slotId }}" src="{{ lam.slotSrc }}" placeholder="{{ lam.placeholder }}" shape="rect" style="{{ cardImgStyle }}" style-hover="{{ cardImgHoverStyle }}"></image-slot>
          </div>
          <div style="{{ lam.captionRowStyle }}">
            <div>
              <div style="{{ lam.cardNameStyle }}">{{ lam.label }}</div>
              <div style="{{ cardSubStyle }}">{{ lam.sub }}</div>
            </div>
            <span style="{{ lam.arrowStyle }}">&#8594;</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <div style="{{ bottomSpacerStyle }}"></div>

  <dc-import name="Footer" accent-color="{{ accent }}" hint-size="100%,400px"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9C7A4A&quot;,&quot;options&quot;:[&quot;#9C7A4A&quot;,&quot;#B8934F&quot;,&quot;#7A8A78&quot;,&quot;#8C7A6B&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;projectName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Central Line&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;categoryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Stanovi&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;isArchived&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1440, hoveredLamela: null, revealed: {} };

  revealIds = ['rv-grid'];

  lamelasData = [
    { key: 'lamela-1', label: 'Lamela I', sub: '14 jedinica po spratu', slotId: 'lam-1-img', placeholder: 'Lamela I', slotSrc: './uploads/lamela.jpg' },
    { key: 'lamela-2', label: 'Lamela II', sub: '5 poslovnih jedinica', slotId: 'lam-2-img', placeholder: 'Lamela II', slotSrc: './uploads/lamela_2.webp' },
    { key: 'lamela-3', label: 'Lamela III', sub: '11 jedinica po spratu', slotId: 'lam-3-img', placeholder: 'Lamela III', slotSrc: './uploads/lamela_3.webp' }
  ];

  componentDidMount() {
    this._onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    this._observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          this.setState(s => ({ revealed: { ...s.revealed, [id]: true } }));
          this._observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    this.revealIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) {
        this.setState(s => ({ revealed: { ...s.revealed, [id]: true } }));
      } else {
        this._observer.observe(el);
      }
    });
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    if (this._observer) this._observer.disconnect();
  }

  setHoveredLamela(key) { this.setState({ hoveredLamela: key }); }

  renderVals() {
    const w = this.state.width || 1440;
    const isMobile = w < 640;
    const isTablet = w >= 640 && w < 1024;

    const projectName = this.props.projectName || 'Central Line';
    const categoryLabel = this.props.categoryLabel || 'Stanovi';
    const isArchived = !!this.props.isArchived;
    const navCurrentPage = isArchived ? 'reference' : 'ponuda-stanova';
    const parentCrumbLabel = isArchived ? 'Reference' : 'Ponuda stanova';
    const parentCrumbHref = isArchived ? './Reference Page.dc.html' : './Ponuda Stanova Page.dc.html';

    const accent = this.props.accentColor || '#9C7A4A';
    const charcoal = '#1A1A1A';
    const ivory = '#F7F6F3';
    const hairline = 'rgba(26,26,26,0.10)';
    const muted = 'rgba(26,26,26,0.58)';
    const serif = "'Cormorant Garamond', serif";
    const sans = "'Cormorant Garamond', serif";
    const numFont = "'Cormorant Garamond', serif";
    const easeOut = 'cubic-bezier(0.16,1,0.3,1)';

    const containerPad = isMobile ? 22 : (isTablet ? 48 : 80);
    const titleSize = isMobile ? 30 : (isTablet ? 42 : 48);
    const cols = isMobile ? 1 : (isTablet ? 2 : 3);

    const reveal = (id, opts) => {
      const isRevealed = !!this.state.revealed[id];
      const delay = (opts && opts.delay) || 0;
      return { opacity: isRevealed ? 1 : 0, transform: isRevealed ? 'translateY(0)' : 'translateY(30px)', transition: 'opacity 0.9s ' + easeOut + ' ' + delay + 's, transform 0.9s ' + easeOut + ' ' + delay + 's' };
    };

    const hovered = this.state.hoveredLamela;
    const lamelas = this.lamelasData.map((l, i) => {
      const isHov = hovered === l.key;
      return {
        ...l,
        href: './Category Floor Plan Detail Page.dc.html?lamela=' + l.key,
        onEnter: () => this.setHoveredLamela(l.key),
        cardStyle: { display: 'block', minWidth: 0, transition: 'transform 0.5s ' + easeOut + ', box-shadow 0.5s ease', ...reveal('rv-grid', { delay: i * 0.12 }) },
        captionRowStyle: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '20px 2px 0', borderTop: '1px solid ' + (isHov ? accent : hairline), marginTop: '18px', transition: 'border-color 0.35s ease' },
        cardNameStyle: { fontFamily: serif, fontWeight: 600, fontSize: '22px', color: isHov ? accent : charcoal, marginBottom: '4px', transition: 'color 0.35s ease' },
        arrowStyle: { fontSize: '20px', color: accent, display: 'inline-block', transform: isHov ? 'translateX(4px)' : 'translateX(0)', transition: 'transform 0.35s ' + easeOut }
      };
    });

    return {
      accent,
      pageStyle: { background: ivory, color: charcoal, fontFamily: sans, minHeight: '100vh', position: 'relative', paddingTop: (isMobile ? 64 : 80) + 'px' },
      crumbWrapStyle: { maxWidth: '1320px', margin: '0 auto', padding: '20px ' + containerPad + 'px 0', display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', fontSize: '13px', color: muted, fontFamily: sans },
      crumbLinkStyle: { color: muted, transition: 'color 0.25s ease' },
      crumbLinkHoverStyle: { color: accent },
      crumbSepStyle: { color: muted },
      crumbActiveStyle: { color: charcoal, fontWeight: 600 },

      headWrapStyle: { maxWidth: '1320px', margin: '0 auto', padding: '20px ' + containerPad + 'px ' + (isMobile ? 32 : 48) + 'px' },
      eyebrowStyle: { fontFamily: sans, textTransform: 'uppercase', letterSpacing: '3px', fontSize: '12px', color: accent, fontWeight: 600, marginBottom: '10px' },
      titleStyle: { fontFamily: serif, fontWeight: 600, fontSize: titleSize + 'px', color: charcoal, margin: '0 0 14px', lineHeight: 1.15 },
      dividerStyle: { width: '48px', height: '2px', margin: '0 0 18px', backgroundImage: 'linear-gradient(90deg, ' + accent + ' 0%, #E8D9BE 25%, ' + accent + ' 50%, #E8D9BE 75%, ' + accent + ' 100%)', backgroundSize: '200% 100%', animation: 'shimmerMove 5s linear infinite' },
      leadStyle: { fontFamily: sans, color: muted, fontSize: '16px', lineHeight: 1.7, maxWidth: '640px', margin: 0, fontWeight: 400 },

      gridWrapStyle: { maxWidth: '1320px', margin: '0 auto', padding: '0 ' + containerPad + 'px ' + (isMobile ? 70 : 150) + 'px' },
      lamelaGridStyle: { display: 'grid', gridTemplateColumns: 'repeat(' + cols + ', minmax(0, 1fr))', gap: isMobile ? '30px' : '40px' },
      lamelas,
      onLeaveLamela: () => this.setHoveredLamela(null),
      cardHoverStyle: { transform: 'translateY(-10px)', boxShadow: '0 34px 64px rgba(26,26,26,0.16), 0 0 36px rgba(156,122,74,0.16)' },
      imgFrameStyle: { position: 'relative', overflow: 'hidden', width: '100%', aspectRatio: '1/1', background: '#EAE8E3' },
      cardImgStyle: { position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', maxWidth: '100%', objectFit: 'cover', transition: 'transform 0.7s ' + easeOut },
      cardImgHoverStyle: { transform: 'scale(1.06)' },
      cardSubStyle: { fontFamily: numFont, fontSize: '12px', color: muted, textTransform: 'uppercase', letterSpacing: '1.2px', fontWeight: 700, whiteSpace: 'nowrap' },
      bottomSpacerStyle: { height: '1px' },

      projectName, categoryLabel, isArchived, parentCrumbLabel, parentCrumbHref, navCurrentPage
    };
  }
}
</script>
</body>
</html>
