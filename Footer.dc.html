<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="{{ footerStyle }}">
  <div style="{{ footerInnerStyle }}">
    <div style="{{ footerTopGridStyle }}">
      <div>
        <img src="assets/kips-logo-white.png" alt="KIPS Gradnja" style="{{ footerLogoImgStyle }}">
        <p style="{{ footerBlurbStyle }}">Gradimo prostore po najvi&scaron;im standardima kvaliteta.</p>
      </div>
      <div>
        <div style="{{ footerColTitleStyle }}">Navigacija</div>
        <div style="{{ footerLinkColStyle }}">
          <sc-for list="{{ footerNavLinks }}" as="link" hint-placeholder-count="4">
            <a href="{{ link.href }}" onMouseEnter="{{ link.onMouseEnter }}" onMouseLeave="{{ link.onMouseLeave }}" style="{{ link.style }}">{{ link.label }}</a>
          </sc-for>
        </div>
      </div>
      <div>
        <div style="{{ footerColTitleStyle }}">Kontakt</div>
        <div style="{{ footerLinkColStyle }}">
          <a href="tel:+38267134134" onMouseEnter="{{ footerPhoneLink.onMouseEnter }}" onMouseLeave="{{ footerPhoneLink.onMouseLeave }}" style="{{ footerPhoneLink.style }}">+382 67 134 134</a>
          <a href="mailto:office@kipsgradnja.me" onMouseEnter="{{ footerEmailLink.onMouseEnter }}" onMouseLeave="{{ footerEmailLink.onMouseLeave }}" style="{{ footerEmailLink.style }}">office@kipsgradnja.me</a>
        </div>
      </div>
    </div>
    <div style="{{ footerHairlineStyle }}"></div>
    <div style="{{ footerBottomRowStyle }}">
      <p style="{{ footerCopyStyle }}">&copy; 2026 KIPS Gradnja d.o.o.</p>
      <p style="{{ footerCreditStyle }}">Powered by: <a href="https://adlogic.me" target="_blank" rel="noopener" onMouseEnter="{{ footerCreditLink.onMouseEnter }}" onMouseLeave="{{ footerCreditLink.onMouseLeave }}" style="{{ footerCreditLink.style }}">ADLOGIC</a></p>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9C7A4A&quot;,&quot;options&quot;:[&quot;#9C7A4A&quot;,&quot;#B8934F&quot;,&quot;#7A8A78&quot;,&quot;#8C7A6B&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { width: typeof window !== 'undefined' ? window.innerWidth : 1440 };

  navLinks = [
    { label: 'Ponuda stanova', href: './Ponuda Stanova Page.dc.html' },
    { label: 'Reference', href: './Reference Page.dc.html' },
    { label: 'Ponuda zemlji\u0161ta', href: './Ponuda Zemljista Page.dc.html' },
    { label: 'O nama', href: './About Us Page.dc.html' }
  ];

  componentDidMount() {
    this._onResize = () => this.setState({ width: window.innerWidth });
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); }
  setHoverKey(key) { this.setState({ hoverKey: key }); }
  clearHoverKey() { this.setState({ hoverKey: null }); }

  renderVals() {
    const w = this.state.width || 1440;
    const isMobile = w < 640;
    const isTablet = w >= 640 && w < 1024;
    const accent = this.props.accentColor || '#9C7A4A';
    const containerPad = isMobile ? 22 : (isTablet ? 48 : 80);
    const serif = "'Cormorant Garamond', serif";
    const sans = "'Jost', sans-serif";
    const numFont = "'Jost', sans-serif";
    const hk = this.state.hoverKey;
    const hoverProps = (key) => ({ onMouseEnter: () => this.setHoverKey(key), onMouseLeave: () => this.clearHoverKey() });
    const mergeHover = (base, hoverStyle, key) => (hk === key ? { ...base, ...hoverStyle } : base);

    return {
      footerStyle: { background: '#141412', padding: (isMobile ? 60 : 90) + 'px ' + containerPad + 'px 32px' },
      footerInnerStyle: { maxWidth: '1320px', margin: '0 auto' },
      footerTopGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : (isTablet ? '1.4fr 1fr 1fr' : '1.6fr 1fr 1fr'), gap: isMobile ? '40px' : '56px', marginBottom: '52px' },
      footerLogoImgStyle: { height: '30px', width: 'auto', display: 'block', marginBottom: '18px' },
      footerBlurbStyle: { fontFamily: sans, fontSize: '16.5px', color: 'rgba(247,246,243,0.55)', lineHeight: 1.7, maxWidth: '320px', fontWeight: 500 },
      footerColTitleStyle: { fontFamily: sans, fontSize: '12.5px', color: 'rgba(247,246,243,0.4)', textTransform: 'uppercase', letterSpacing: '2px', marginBottom: '20px' },
      footerLinkColStyle: { display: 'flex', flexDirection: 'column', gap: '13px' },
      footerNavLinks: this.navLinks.map((l, i) => ({ ...l, ...hoverProps('footerNav' + i), style: mergeHover(
        { fontFamily: sans, fontSize: '15.5px', color: 'rgba(247,246,243,0.75)', fontWeight: 400, display: 'inline-block', transition: 'color 0.3s ease-out, transform 0.3s ease-out' },
        { color: accent, transform: 'translateX(3px)' },
        'footerNav' + i
      ) })),
      footerPhoneLink: { ...hoverProps('footerPhone'), style: mergeHover(
        { fontFamily: numFont, fontSize: '15.5px', color: 'rgba(247,246,243,0.75)', fontWeight: 700, display: 'inline-block', transition: 'color 0.3s ease-out, transform 0.3s ease-out' },
        { color: accent, transform: 'translateX(3px)' },
        'footerPhone'
      ) },
      footerEmailLink: { ...hoverProps('footerEmail'), style: mergeHover(
        { fontFamily: sans, fontSize: '15.5px', color: 'rgba(247,246,243,0.75)', fontWeight: 400, display: 'inline-block', transition: 'color 0.3s ease-out, transform 0.3s ease-out' },
        { color: accent, transform: 'translateX(3px)' },
        'footerEmail'
      ) },
      footerHairlineStyle: { height: '1px', background: 'rgba(247,246,243,0.1)', margin: '0 0 26px' },
      footerBottomRowStyle: { display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center', justifyContent: 'space-between' },
      footerCopyStyle: { fontFamily: numFont, fontWeight: 700, color: 'rgba(247,246,243,0.4)', fontSize: '13.5px', margin: 0 },
      footerCreditStyle: { color: 'rgba(247,246,243,0.4)', fontSize: '13.5px', margin: 0 },
      footerCreditLink: { ...hoverProps('footerCredit'), style: mergeHover(
        { color: 'rgba(247,246,243,0.65)', display: 'inline-block', transition: 'color 0.3s ease-out, transform 0.3s ease-out' },
        { color: accent, transform: 'translateX(2px)' },
        'footerCredit'
      ) }
    };
  }
}
</script>
</body>
</html>
